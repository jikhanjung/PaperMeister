# Local pre-commit hooks. Install once with:  pre-commit install
# Fast, runs on staged files at commit time. Mirrors the CI ruff gate.
# (ruff-format is intentionally omitted until the dedicated format pass — the
# tree isn't ruff-formatted yet; see devlog P15.)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml
