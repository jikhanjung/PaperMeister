version: 2
updates:
  # Python dependencies. Bumps land in requirements.txt / requirements-dev.txt;
  # dependabot-lock-refresh.yml then regenerates the lockfiles on the PR branch,
  # because a bump without a re-lock fails the lock-check gate in security.yml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "@jikhanjung"
    assignees:
      - "@jikhanjung"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Actions get security fixes and pinned majors go stale otherwise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    ignore:
      # Every action here is referenced by its floating major tag (@v4, @v7),
      # which is how the publishers ship security fixes without our involvement.
      # Dependabot otherwise offers to pin codeql-action to the exact patch
      # (v4 -> v4.37.4), which would make it the one action in the repo that
      # needs a PR per patch release. Major bumps still come through, because
      # those are the ones that actually need a human to look.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
