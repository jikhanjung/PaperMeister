name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:  # invoked by release.yml before building

jobs:
  # --------------------------------------------------------------------------
  # Lint — gating, runs once (not per-OS). The tree is kept ruff-clean.
  # (ruff format is not enforced yet — code isn't ruff-formatted; a dedicated
  # format pass + `ruff format --check` comes later, per devlog P15.)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: ruff check
        run: ruff check . --output-format=github

  # --------------------------------------------------------------------------
  # Tests — Linux + Windows (the platforms that matter here: WSL-dev, Windows-run).
  # All legs gating. Same commands on both via bash (Git Bash on Windows).
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    defaults:
      run:
        shell: bash  # same scripts on Windows (Git Bash)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 dlopens these even under the offscreen platform on headless Linux.
      # (No OpenGL/GLUT/Xvfb: this app renders PDFs via PyMuPDF, not GL.)
      - name: Install Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Fast cross-platform guard: import every module. Catches version-only
      # symbols / broken native extensions the unit tests would miss.
      - name: Smoke test (imports)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_smoke.py -v

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=short
