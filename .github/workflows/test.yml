name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:  # invoked by release.yml before building

jobs:
  # --------------------------------------------------------------------------
  # Lint — gating, runs once (not per-OS). The tree is kept ruff-clean.
  # (ruff format is not enforced yet — code isn't ruff-formatted; a dedicated
  # format pass + `ruff format --check` comes later, per devlog P15.)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - name: ruff check
        run: ruff check . --output-format=github
      # Type checking is incremental: gate only the modules already at zero mypy
      # errors. Expand this list as more modules are cleaned (config in
      # pyproject.toml [tool.mypy]).
      - name: mypy (typed core modules)
        run: mypy papermeister/references.py papermeister/search.py papermeister/biblio.py

      # Non-gating: surfaces the most tangled functions so they can be picked off
      # deliberately, without blocking work on code that is already this shape.
      - name: Complexity report (C901, non-gating)
        run: ruff check --select C901 --statistics . || true

  # --------------------------------------------------------------------------
  # Tests — Linux + Windows (the platforms that matter here: WSL-dev, Windows-run).
  # All legs gating. Same commands on both via bash (Git Bash on Windows).
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    defaults:
      run:
        shell: bash  # same scripts on Windows (Git Bash)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 dlopens these even under the offscreen platform on headless Linux.
      # (No OpenGL/GLUT/Xvfb: this app renders PDFs via PyMuPDF, not GL.)
      - name: Install Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Fast cross-platform guard: import every module. Catches version-only
      # symbols / broken native extensions the unit tests would miss.
      - name: Smoke test (imports)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_smoke.py -v

      # Coverage is measured on Linux only (one number, no per-OS merging).
      # --cov-fail-under is a ratchet floor, currently just under the measured
      # 20%: it exists to stop regressions, not to claim the suite is thorough.
      # Raise it as tests are added. Scoped to the two shipped packages —
      # scripts/ are one-off operational tools, not part of the app.
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pytest tests/ --cov=papermeister --cov=desktop \
              --cov-report=term --cov-report=xml \
              --cov-fail-under=18 --tb=short
          else
            pytest tests/ --tb=short
          fi

      - name: Upload coverage (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
