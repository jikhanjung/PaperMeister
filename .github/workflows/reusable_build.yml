name: Reusable Build Workflow

# Mirrors Modan2's reusable_build.yml. Three legs — Windows (portable zip +
# Inno Setup installer), Linux (AppImage), macOS (DMG). All install from the
# hash-pinned requirements.lock for reproducibility.
on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Clean pip env (NOT conda) — this is exactly the environment that fixed
      # the conda-DLL packaging failures (devlog 061). The spec's conda-only
      # Library\bin fixup is guarded by os.path.isdir, so it no-ops here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller onedir)
        run: pyinstaller PaperMeister.spec

      - name: Zip portable build
        shell: pwsh
        run: |
          $zip = "PaperMeister-Windows-Portable-v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}.zip"
          if (Test-Path "dist/PaperMeister") {
            Compress-Archive -Path "dist/PaperMeister/*" -DestinationPath $zip
            echo "Created $zip"
          } else {
            echo "ERROR: dist/PaperMeister not found"; exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Pin the installer at a GitHub release asset (jrsoftware.org only keeps
          # the latest 6.x, so point releases start 404-ing).
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile inno.exe
          Start-Process -FilePath inno.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $tpl = Get-Content "installer/PaperMeister.iss.template" -Raw
          $tpl = $tpl.Replace("{{VERSION}}", $ver).Replace("{{DIST_PATH}}", "$PWD\dist").Replace("{{OUTPUT_DIR}}", "$PWD\installer\Output")
          Set-Content -Path "installer/PaperMeister.iss" -Value $tpl
          $env:BUILD_NUMBER = "${{ inputs.build_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/PaperMeister.iss"
          echo "=== installer output ==="; Get-ChildItem "installer/Output" -Name
          # Move it beside the zip so the artifact is flat. Uploading it from
          # installer/Output preserved that path, and the release step's
          # `release-files/**/*.exe` did not reach four levels down — the
          # installer was downloaded and checksummed but never attached, in
          # v0.1.1 and v0.1.2 both. Same depth as every other artifact now.
          Move-Item "installer/Output/*.exe" -Destination "." -Force
          echo "=== to upload ==="; Get-ChildItem "PaperMeister*" -Name

      # Launch the frozen build headless and assert it boots to a live main
      # window then exits 0 (`--self-test`). The executable is self-contained —
      # it uses its bundled Python and libraries, not the build environment — so
      # this catches the "works from source, dies when frozen" class: a missing
      # --add-data entry, an unbundled native library, a Qt platform plugin or
      # SQLite driver that never made it into the bundle. That is exactly how the
      # conda-DLL failure presented (devlog 061), and no source-tree test can
      # reach it. Until this existed, released artifacts had never been run.
      - name: Smoke-test frozen build (Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist/PaperMeister/PaperMeister.exe"
          if (-not (Test-Path $exe)) { echo "ERROR: $exe not found"; exit 1 }
          # Start-Process -Wait so a windowed (--noconsole) app is actually awaited.
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { echo "Smoke test FAILED: exit $($p.ExitCode)"; exit 1 }
          echo "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: papermeister-windows
          path: |
            PaperMeister-Windows-*.zip
            PaperMeister_*_Installer.exe

  # Linux leg — wraps the PyInstaller onedir as an AppImage. No code signing
  # needed (unlike macOS). Note: like the Windows build it bundles Qt but not
  # host system libs, so a target machine may still need the xcb runtime libs.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Download appimagetool
        run: |
          curl -LO https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Get version
        id: get_version
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller onedir)
        run: pyinstaller PaperMeister.spec

      # Same rationale as the Windows smoke test. Run before packaging, so a
      # broken bundle fails here rather than being wrapped into an AppImage.
      # `timeout` bounds it in case the app never reaches the exit path.
      - name: Smoke-test frozen build (Linux)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe="dist/PaperMeister/PaperMeister"
          if [ ! -x "$exe" ]; then echo "ERROR: $exe not found"; ls -la dist/ 2>/dev/null; exit 1; fi
          timeout 120 "$exe" --self-test
          echo "Smoke test passed"

      - name: Create AppImage
        run: |
          chmod +x packaging/linux/create_appimage.sh
          packaging/linux/create_appimage.sh v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: papermeister-linux
          path: build_linux/PaperMeister-Linux-*.AppImage

  # macOS leg — PyInstaller onedir → .app → .dmg (hdiutil). NOT notarized/signed,
  # so Gatekeeper warns on first launch (right-click → Open). First CI run also
  # confirms PyQt6 / PyMuPDF ship arm64 macOS wheels for the pinned versions.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Get version
        id: get_version
        run: echo "VERSION=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller onedir)
        run: pyinstaller PaperMeister.spec

      # Same rationale as the Windows smoke test. macOS runners have no
      # `timeout`, so the in-app --self-test watchdog is what bounds this.
      - name: Smoke-test frozen build (macOS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe="dist/PaperMeister/PaperMeister"
          if [ ! -x "$exe" ]; then echo "ERROR: $exe not found"; ls -la dist/ 2>/dev/null; exit 1; fi
          "$exe" --self-test
          echo "Smoke test passed"

      - name: Create .app + .dmg
        run: |
          chmod +x packaging/macos/create_dmg.sh
          packaging/macos/create_dmg.sh v${{ steps.get_version.outputs.VERSION }}-build${{ inputs.build_number }} ${{ steps.get_version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: papermeister-macos
          path: PaperMeister-macOS-*.dmg
